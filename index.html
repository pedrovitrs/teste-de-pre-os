<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azhar Perfumaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ====== CORES: troque aqui para casar com a identidade da loja ====== */
:root{
  --bg:#FAF5EE; --ink:#2A1420; --plum:#3B1A2E; --gold:#B8883A; --gold-soft:#E9D6AE;
  --muted:#7B6A70; --line:#E6DAC9; --card:#FFFFFF; --ok:#1F7A4D;
  --display:'Marcellus','Times New Roman',serif; --body:'Jost',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1D0E17;--ink:#F5ECE0;--plum:#2A1220;--card:#2A1623;--line:#4A2C3D;--muted:#B9A5AE;--gold-soft:#5A4320}
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;background:var(--plum);color:#F5ECE0}
.logo{font-family:var(--display);font-size:1.5rem;letter-spacing:.14em}
.cart-btn{display:flex;gap:10px;align-items:center;padding:9px 16px;border:1px solid var(--gold);border-radius:999px;color:#F5ECE0}
.cart-btn b{background:var(--gold);color:var(--plum);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
.hero{background:var(--plum);color:#F5ECE0;padding:clamp(48px,9vw,110px) 5vw;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.05;max-width:14ch}
.hero p{margin:18px 0 26px;max-width:44ch;color:#D9C7CF}
.btn{display:inline-block;background:var(--gold);color:var(--plum);padding:13px 26px;border-radius:999px;font-weight:600;text-decoration:none}
.hero svg{width:100%;max-width:300px;justify-self:center}
.bar{padding:34px 5vw 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h2{font-family:var(--display);font-weight:400;font-size:1.9rem;margin-right:auto}
.chip{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--plum);color:#F5ECE0;border-color:var(--plum)}
.grid{padding:16px 5vw 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .pic{aspect-ratio:1;display:grid;place-items:center}
.card .pic svg{width:46%}
.card .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-family:var(--display);font-weight:400;font-size:1.15rem}
.card small{color:var(--muted)}
.price{margin-top:auto;padding-top:8px;font-weight:600;font-size:1.1rem}
.add{margin-top:10px;padding:10px;border-radius:10px;background:var(--plum);color:#F5ECE0;font-weight:500}
.add:hover{background:var(--gold);color:var(--plum)}
.ovl{position:fixed;inset:0;background:rgba(20,8,14,.55);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.ovl.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(440px,100%);background:var(--bg);z-index:31;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
aside.on{transform:none}
.ch{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.ch h2{font-family:var(--display);font-weight:400}
.items{flex:1 1 auto;min-height:90px;overflow:auto;padding:8px 22px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .qty{display:flex;align-items:center;gap:10px}
.row .qty button{width:28px;height:28px;border:1px solid var(--line);border-radius:50%}
.row .rm{color:var(--muted);font-size:.85rem;text-decoration:underline}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.foot{flex:0 1 auto;max-height:68%;overflow-y:auto;padding:16px 22px 22px;border-top:1px solid var(--line);display:grid;gap:10px;align-content:start}
.send{position:sticky;bottom:0}
.foot input,.foot select,.foot textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:600}
.send{background:var(--ok);color:#fff;padding:14px;border-radius:12px;font-weight:600;font-size:1rem}
.send:disabled{opacity:.4;cursor:not-allowed}
.err{color:#B3261E;font-size:.85rem;min-height:1em}
footer{padding:30px 5vw;text-align:center;color:var(--muted);border-top:1px solid var(--line);font-size:.9rem}
@media(max-width:720px){.hero{grid-template-columns:1fr}.hero svg{max-width:180px;order:-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo" id="storeName">AZHAR</div>
  <button class="cart-btn" id="openCart" aria-label="Abrir carrinho">Carrinho <b id="count">0</b></button>
</header>

<section class="hero">
  <div>
    <h1>Perfumes que ficam na memória</h1>
    <p>Escolha suas fragrâncias, monte o carrinho e finalize o pedido direto pelo WhatsApp.</p>
    <a class="btn" href="#catalogo">Ver perfumes</a>
  </div>
  <svg viewBox="0 0 120 170" aria-hidden="true"><rect x="46" y="6" width="28" height="22" rx="4" fill="#B8883A"/><rect x="52" y="28" width="16" height="10" fill="#E9D6AE"/><rect x="14" y="38" width="92" height="124" rx="16" fill="none" stroke="#B8883A" stroke-width="3"/><rect x="24" y="96" width="72" height="56" rx="8" fill="#B8883A" opacity=".35"/><circle cx="60" cy="72" r="13" fill="none" stroke="#E9D6AE" stroke-width="2"/></svg>
</section>

<div class="bar" id="catalogo">
  <h2>Catálogo</h2>
  <div id="chips" role="group" aria-label="Filtrar por categoria" style="display:flex;gap:8px;flex-wrap:wrap"></div>
</div>
<main class="grid" id="grid"></main>
<footer id="foot">Pedidos finalizados pelo WhatsApp</footer>

<div class="ovl" id="ovl"></div>
<aside id="drawer" aria-label="Carrinho" aria-hidden="true">
  <div class="ch"><h2>Seu carrinho</h2><button id="closeCart" aria-label="Fechar">✕</button></div>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
    <input id="nome" placeholder="Seu nome" autocomplete="name">
    <select id="entrega"><option>Retirar na loja</option><option>Entrega</option></select>
    <div id="end" hidden style="display:none;gap:10px">
      <input id="rua" placeholder="Rua / Avenida" autocomplete="address-line1">
      <input id="num" placeholder="Número (ou S/N)" inputmode="numeric">
      <input id="comp" placeholder="Complemento (apto, bloco, casa...)">
      <input id="bairro" placeholder="Bairro">
      <input id="cidade" placeholder="Cidade" value="Barra do Mendes" autocomplete="address-level2">
      <select id="uf" aria-label="Estado"><option>BA</option><option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option></select>
      <input id="cep" placeholder="CEP (opcional)" inputmode="numeric" autocomplete="postal-code">
      <input id="ref" placeholder="Ponto de referência (opcional)">
    </div>
    <select id="pagto"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select>
    <textarea id="obs" rows="2" placeholder="Observações (opcional)"></textarea>
    <div class="err" id="err" role="alert"></div>
    <button class="send" id="send" disabled>Enviar pedido no WhatsApp</button>
  </div>
</aside>

<script>
/* ====== CONFIGURAÇÃO: edite só esta parte ====== */
const CONFIG = {
  loja: "Azhar Perfumaria",
  whatsapp: "557498174314",                // PREFERIDO: DDI 55 + DDD + número, só dígitos (ex: 557498174314 = 74 9817-4314)
  link: "https://w.app/azharperfumaria", // usado só se o número acima ficar vazio
  moeda: "BRL"
};
// cor = tom do frasco. Troque nome, preço, categoria e (opcional) foto: "img/nome.jpg"
const PRODUTOS = [
  {id:1,nome:"Perfume Árabe Âmbar",cat:"Masculino",ml:100,preco:149.9,cor:"#B8883A"},
  {id:2,nome:"Oud Real",cat:"Masculino",ml:100,preco:189.9,cor:"#5A2A3C"},
  {id:3,nome:"Rosa de Damasco",cat:"Feminino",ml:80,preco:169.9,cor:"#C0627E"},
  {id:4,nome:"Jasmim Noturno",cat:"Feminino",ml:80,preco:159.9,cor:"#8E7CC3"},
  {id:5,nome:"Almíscar Branco",cat:"Unissex",ml:100,preco:139.9,cor:"#9BB7B0"},
  {id:6,nome:"Óleo Concentrado Sândalo",cat:"Óleos",ml:12,preco:59.9,cor:"#A0693A"},
  {id:7,nome:"Óleo Concentrado Rosa",cat:"Óleos",ml:12,preco:59.9,cor:"#D58BA0"},
  {id:8,nome:"Body Splash Baunilha",cat:"Body splash",ml:200,preco:49.9,cor:"#D9B77A"}
];

const $=id=>document.getElementById(id);
const fmt=v=>v.toLocaleString("pt-BR",{style:"currency",currency:CONFIG.moeda}).replace(/\u00a0/g," ");
let cart={}, filtro="Todos";
try{cart=JSON.parse(localStorage.getItem("azhar_cart")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("azhar_cart",JSON.stringify(cart))}catch(e){}};

document.title=CONFIG.loja; $("storeName").textContent=CONFIG.loja.split(" ")[0].toUpperCase();

function frasco(cor){return `<svg viewBox="0 0 120 170" aria-hidden="true"><rect x="46" y="6" width="28" height="22" rx="4" fill="${cor}"/><rect x="52" y="28" width="16" height="10" fill="${cor}" opacity=".6"/><rect x="14" y="38" width="92" height="124" rx="16" fill="${cor}" opacity=".25" stroke="${cor}" stroke-width="3"/><rect x="24" y="96" width="72" height="56" rx="8" fill="${cor}" opacity=".6"/></svg>`}

function chips(){
  const cats=["Todos",...new Set(PRODUTOS.map(p=>p.cat))];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===filtro}" data-c="${c}">${c}</button>`).join("");
}
function grid(){
  $("grid").innerHTML=PRODUTOS.filter(p=>filtro==="Todos"||p.cat===filtro).map(p=>`
  <article class="card">
    <div class="pic" style="background:${p.cor}1f">${p.img?`<img src="${p.img}" alt="${p.nome}" style="width:100%;height:100%;object-fit:cover">`:frasco(p.cor)}</div>
    <div class="info"><h3>${p.nome}</h3><small>${p.cat} · ${p.ml} ml</small>
    <div class="price">${fmt(p.preco)}</div>
    <button class="add" data-add="${p.id}">Adicionar ao carrinho</button></div>
  </article>`).join("");
}
function render(){
  const ids=Object.keys(cart).filter(id=>cart[id]>0);
  let total=0,qtd=0;
  $("items").innerHTML=ids.length?ids.map(id=>{
    const p=PRODUTOS.find(x=>x.id==id); if(!p) return "";
    const q=cart[id]; total+=p.preco*q; qtd+=q;
    return `<div class="row"><div><b>${p.nome}</b><br><small>${p.ml} ml · ${fmt(p.preco)}</small></div>
    <div class="qty"><button data-dec="${id}" aria-label="Diminuir">−</button><span>${q}</span><button data-inc="${id}" aria-label="Aumentar">+</button></div>
    <button class="rm" data-rm="${id}">Remover</button><b style="text-align:right">${fmt(p.preco*q)}</b></div>`}).join("")
    :`<div class="empty">Seu carrinho está vazio.<br>Adicione perfumes do catálogo.</div>`;
  $("count").textContent=qtd; $("total").textContent=fmt(total); $("send").disabled=!qtd; save();
}
function toggleCart(on){$("drawer").classList.toggle("on",on);$("ovl").classList.toggle("on",on);$("drawer").setAttribute("aria-hidden",!on)}

document.addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.c){filtro=t.dataset.c;chips();grid()}
  if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;render();toggleCart(true)}
  if(t.dataset.inc){cart[t.dataset.inc]++;render()}
  if(t.dataset.dec){cart[t.dataset.dec]=Math.max(0,cart[t.dataset.dec]-1);render()}
  if(t.dataset.rm){delete cart[t.dataset.rm];render()}
});
$("openCart").onclick=()=>toggleCart(true); $("closeCart").onclick=()=>toggleCart(false); $("ovl").onclick=()=>toggleCart(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")toggleCart(false)});
$("entrega").onchange=()=>{const on=$("entrega").value==="Entrega";$("end").hidden=!on;$("end").style.display=on?"grid":"none"};

/* Emojis por código Unicode (sem seletores de variação) - aparecem no iPhone e no Android */
const E={oi:"\u{1F44B}",pedido:"\u{1F6D2}",pgto:"\u{1F4B3}",local:"\u{1F4CD}",obs:"\u{1F4DD}",ok:"\u{1F64F}"};
$("send").onclick=()=>{
  const nome=$("nome").value.trim(), ent=$("entrega").value, v=id=>$(id).value.trim();
  if(!nome){$("err").textContent="Informe seu nome para finalizar.";return}
  if(ent==="Entrega"&&(!v("rua")||!v("num")||!v("bairro")||!v("cidade"))){$("err").textContent="Informe rua, número, bairro e cidade para a entrega.";return}
  $("err").textContent="";
  let total=0, linhas=Object.keys(cart).filter(id=>cart[id]>0).map(id=>{
    const p=PRODUTOS.find(x=>x.id==id), sub=p.preco*cart[id]; total+=sub;
    return `- ${cart[id]}x ${p.nome} (${p.ml} ml) - ${fmt(sub)}`});
  const m=[`Olá, ${CONFIG.loja}! ${E.oi}`,`Meu nome é *${nome}* e gostaria de fazer este pedido:`,"",
    `${E.pedido} *PEDIDO*`,...linhas,"",`*Total: ${fmt(total)}*`,"",
    `${E.pgto} *PAGAMENTO*`,$("pagto").value,"",
    `${E.local} *RECEBIMENTO*`];
  if(ent==="Entrega"){
    m.push("Entrega no endereço:",`${v("rua")}, ${v("num")}${v("comp")?" - "+v("comp"):""}`,`Bairro: ${v("bairro")}`,`${v("cidade")} - ${v("uf")}${v("cep")?" | CEP "+v("cep"):""}`);
    if(v("ref")) m.push("Referência: "+v("ref"));
  } else m.push("Vou retirar na loja");
  if(v("obs")) m.push("",`${E.obs} *OBSERVAÇÕES*`,v("obs"));
  m.push("",`Aguardo a confirmação. Obrigado! ${E.ok}`);
  const txt=encodeURIComponent(m.join("\n"));
  const url=CONFIG.whatsapp?`https://wa.me/${CONFIG.whatsapp}?text=${txt}`:`${CONFIG.link}?text=${txt}`;
  window.location.href=url;
};
chips();grid();render();
</script>
</body>
</html>
